name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Test ads only in CI artifacts, so builds never generate real ad traffic.
      EXPO_PUBLIC_ADS_TEST: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Write Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photocell-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Write Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build for simulator (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace photocell.xcworkspace \
            -scheme photocell \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../build-ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app
        run: |
          APP=$(find build-ios/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          mkdir -p out
          cd "$(dirname "$APP")" && zip -r "$GITHUB_WORKSPACE/out/photocell-ios-simulator.zip" "$(basename "$APP")"

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: photocell-ios-simulator
          path: out/photocell-ios-simulator.zip
          if-no-files-found: error
